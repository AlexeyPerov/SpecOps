name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-tag:
    name: validate semver tag
    runs-on: ubuntu-latest
    steps:
      - name: Require semver tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          # GitHub tag globs are not full regexes; enforce semver here before builds.
          # Accepts vMAJOR.MINOR.PATCH with optional -prerelease and +buildmetadata.
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' is not a valid semver release tag."
            echo "Expected forms: v1.2.3, v1.2.3-beta.1, v1.2.3+build.1"
            exit 1
          fi
          echo "Tag $TAG is a valid semver release tag."

  build:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Install host build dependencies
        working-directory: app/host
        run: npm ci

      - name: Validate selected release evidence
        run: node scripts/release/check-component-record.mjs specs/ops/08-release-gates/release-2026-10-11-components.json

      - name: Build unsigned candidate only
        working-directory: app
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app

      - name: Measure and inspect lean candidate
        run: python3 scripts/release/measure-base.py --app app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/SpecOps.app --output "$RUNNER_TEMP/specops-candidate-inventory.json"

      - name: Archive unsigned candidate
        run: ditto -c -k --keepParent app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/SpecOps.app "$RUNNER_TEMP/SpecOps-darwin-arm64-candidate.zip"

      - name: Save reviewable candidate and inventory
        uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64-candidate-inventory
          path: |
            ${{ runner.temp }}/specops-candidate-inventory.json
            ${{ runner.temp }}/SpecOps-darwin-arm64-candidate.zip

      # Publishing requires a separately reviewed signed artifact, coherent ready
      # record and --decision --require-current-source; rebuilding is not acceptance.
