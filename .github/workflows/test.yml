name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Verify git on PATH
        run: git --version

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Test release helper
        run: node --test scripts/release.test.mjs

      - name: Run vitest suite
        working-directory: app
        run: npm test

      - name: Typecheck
        if: matrix.os == 'ubuntu-latest'
        working-directory: app
        run: npm run check

  rust:
    name: cargo test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Run Rust tests
        working-directory: app/src-tauri
        run: cargo test

  docs:
    name: markdown links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check Markdown links
        run: node scripts/check-markdown-links.mjs

  managed-components:
    name: managed component source gates (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend and host build dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix app/host
      - name: Separate component fixture preparation
        run: |
          npm run build --prefix app/host
          npm run fixtures:assets --prefix app/host
      - name: Host and component release contracts
        run: |
          npm run check --prefix app/host
          npm test --prefix app/host -- --fileParallelism=false
          node --test scripts/release/check-record.test.mjs scripts/release/check-component-record.test.mjs scripts/release/check-costs.test.mjs
          python3 -m unittest discover -s scripts/components -p 'test_artifacts.py'
          python3 -m unittest discover -s scripts/release -p 'test_measure_base.py'
      - name: Native installer and host source controls
        run: cargo test --manifest-path app/src-tauri/Cargo.toml
